name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 */2 * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Escritura en Supabase
        env:
          SUPABASE_URL: https://hnlhhwululasvlckbcrq.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_-3SmtEtO1brhGbThaJeICw_OPugVcG9
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'

  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Evitar desactivación por 60 días sin commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/keep-supabase-awake.yml/enable"
