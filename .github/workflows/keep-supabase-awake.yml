name: Keep Supabase awake

# El plan gratis de Supabase pausa el proyecto después de 7 días sin
# actividad. Este workflow le pega una consulta liviana cada 3 días para
# que nunca llegue a esos 7 — no necesita ningún secreto: la llave que usa
# es la misma llave pública (anon) que ya viaja en js/config.js, pensada
# para ser pública (el acceso real lo controla RLS del lado de la base,
# ver SUPABASE.md).

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la base de Supabase
        env:
          SUPABASE_URL: https://hnlhhwululasvlckbcrq.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_-3SmtEtO1brhGbThaJeICw_OPugVcG9
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/comisiones?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
