name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        env:
          SUPABASE_URL: https://hnlhhwululasvlckbcrq.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_-3SmtEtO1brhGbThaJeICw_OPugVcG9
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/comisiones?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" -o /dev/null

  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
